name: Build APK

on:
  push:
    branches:
      - main
      - claude/pacepals-app-design-JR60l
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacepal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-debug
          name: PacePal v1.0.1 (debug)
          body: |
            Debug build of PacePal for testing on your phone.

            **Install:** Download `app-debug.apk` below on your Android phone, open it, and allow installation from unknown sources when prompted.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
