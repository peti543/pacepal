name: Build Orbit Game APK

on:
  push:
    branches:
      - main
      - claude/android-planet-game-y6d0qt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build debug APK
        run: gradle :game:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-debug-apk
          path: game/build/outputs/apk/debug/game-debug.apk

      - name: Attach APK to release
        if: github.ref == 'refs/heads/claude/android-planet-game-y6d0qt'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orbit-v1.0.0-debug
          name: Orbit — Solar System Explorer v1.0.0 (debug)
          body: |
            Debug build of **Orbit**, an interactive solar-system explorer.

            **Install:** Download `game-debug.apk` below on your Android phone,
            open it, and allow installation from unknown sources when prompted.

            Pan to drift through the system, pinch to zoom, and tap any planet
            (or the Sun) to watch it spin and read its facts.
          files: game/build/outputs/apk/debug/game-debug.apk
          make_latest: false
