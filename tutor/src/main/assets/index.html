<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Problem Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBFAF4;
    --graphite: #2B2B33;
    --ink: #1F4E79;
    --yellow: #F5D547;
    --red: #C03A2B;
    --grid: rgba(31, 78, 121, 0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'STIX Two Text', Georgia, serif;
    color: var(--graphite);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  /* red margin rule down the left side */
  body::before {
    content: "";
    position: fixed;
    top: 0; bottom: 0; left: 26px;
    width: 1.5px;
    background: var(--red);
    opacity: 0.55;
    pointer-events: none;
    z-index: 1;
  }
  header {
    padding: 10px 12px 8px 38px;
    border-bottom: 1.5px solid var(--graphite);
    background: var(--paper);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    flex-shrink: 0;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
  }
  h1 { font-size: 20px; font-weight: 600; line-height: 1.2; }
  #tally {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink);
    white-space: nowrap;
  }
  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 12px 8px 38px;
    border-bottom: 1.5px solid var(--graphite);
    background: var(--paper);
    flex-shrink: 0;
  }
  select, button, textarea {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--graphite);
    background: var(--paper);
    border: 1.5px solid var(--graphite);
    border-radius: 0;
  }
  select { padding: 6px 4px; max-width: 100%; flex: 1 1 100px; min-width: 0; }
  button { padding: 7px 12px; cursor: pointer; }
  button:hover, button:active { background: var(--yellow); }
  button:disabled { opacity: 0.45; }
  button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button.primary:hover, button.primary:active { background: var(--yellow); color: var(--graphite); border-color: var(--graphite); }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 14px 12px 14px 38px;
  }
  .msg {
    max-width: 100%;
    margin-bottom: 14px;
    padding: 8px 10px;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 16px;
    line-height: 1.45;
  }
  .msg.tutor { border-left: 3px solid var(--ink); }
  .msg.student {
    margin-left: 28px;
    border-left: 3px solid var(--red);
    background: rgba(245, 213, 71, 0.30);
  }
  .msg.note {
    border-left: 3px solid var(--red);
    color: var(--red);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }
  .msg.thinking {
    border-left: 3px solid var(--ink);
    color: var(--ink);
    font-style: italic;
  }
  #inputbar {
    border-top: 1.5px solid var(--graphite);
    background: var(--paper);
    padding: 8px 12px 10px 38px;
    flex-shrink: 0;
  }
  #inputbar textarea {
    width: 100%;
    min-height: 64px;
    padding: 8px;
    resize: vertical;
    font-size: 15px;
  }
  #inputbar .row { display: flex; gap: 6px; margin-top: 6px; }
  #inputbar .row button { flex: 1; }
  /* API key overlay */
  #keyOverlay {
    position: fixed; inset: 0;
    background: rgba(43, 43, 51, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  #keyOverlay.hidden { display: none; }
  #keyBox {
    background: var(--paper);
    border: 1.5px solid var(--graphite);
    padding: 18px;
    width: 100%;
    max-width: 420px;
  }
  #keyBox h2 { font-size: 17px; margin-bottom: 8px; }
  #keyBox p { font-size: 13px; margin-bottom: 10px; line-height: 1.4; }
  #keyBox input {
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 8px;
    border: 1.5px solid var(--graphite);
    border-radius: 0;
    background: var(--paper);
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Introduction to Counting &amp; Probability</div>
    <h1>Problem Session</h1>
  </div>
  <div id="tally">solved 0 / attempted 0</div>
</header>

<div id="controls">
  <select id="chapter" aria-label="Chapter"></select>
  <select id="topic" aria-label="Topic"></select>
  <select id="level" aria-label="Level">
    <option>Exercise</option>
    <option>Challenge</option>
  </select>
  <button id="newProblem" class="primary">New problem</button>
  <button id="primer">Primer</button>
  <button id="keyBtn" title="API key">&#9881;</button>
</div>

<div id="chat"></div>

<div id="inputbar">
  <textarea id="input" placeholder="Work it out here&hellip; (Enter makes a new line)"></textarea>
  <div class="row">
    <button id="submit" class="primary">Submit</button>
    <button id="hint">Hint</button>
    <button id="solution">Solution</button>
  </div>
</div>

<div id="keyOverlay" class="hidden">
  <div id="keyBox">
    <h2>Anthropic API key</h2>
    <p>Paste your API key (starts with <code>sk-ant-</code>). It is stored only on this device and sent only to api.anthropic.com.</p>
    <input id="keyInput" type="password" placeholder="sk-ant-..." autocomplete="off">
    <button id="keySave" class="primary">Save</button>
  </div>
</div>

<script>
"use strict";

const CHAPTERS = [
  "Counting Is Arithmetic",
  "Basic Counting Techniques",
  "Correcting for Overcounting",
  "Committees and Combinations",
  "More With Combinations",
  "Some Harder Counting Problems",
  "Introduction to Probability",
  "Basic Probability Techniques",
  "Think About It!",
  "Geometric Probability",
  "Expected Value",
  "Pascal's Triangle"
];

const CH2_TOPICS = [
  "Casework",
  "Complementary counting",
  "Constructive counting",
  "Inclusion-exclusion 2 sets",
  "Inclusion-exclusion 3 sets"
];

const SYSTEM_PROMPT = `You are a Socratic math tutor in the style of Art of Problem Solving (AoPS), working from the book "Introduction to Counting & Probability" by David Patrick.

Rules:
- Never reveal the final answer or a full solution unless the student commits to a final answer or explicitly asks to see the solution (e.g. "show solution").
- When asked for a new problem: write exactly ONE problem in AoPS phrasing for the requested chapter, topic, and level, with the problem number the student gives you. No hints with it. "Exercise" means end-of-section exercise difficulty; "Challenge" means end-of-chapter Challenge Problems difficulty.
- If the student's answer is wrong: do NOT reveal the answer. Name the likely misstep, then ask one pointed question to steer them.
- If the student's committed final answer is correct: start your reply with the literal marker [CORRECT] (it is stripped before display), confirm briefly, then ask exactly one extension question. Use the marker only for a correct final answer to the current problem.
- Hints are a ladder, one rung per request: hint 1 reframes the problem, hint 2 names the technique, hint 3 gives the first concrete step. Never give more than one rung at a time.
- A "primer" request is always allowed: explain the selected topic in plain language with one tiny worked example.
- Use plain-text math only, e.g. C(8,3), 8!/(3!*5!), |A ∪ B|. Never use LaTeX.
- Keep the warm, curious, rigorous AoPS tone. Be concise.`;

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const tallyEl = document.getElementById("tally");
const chapterSel = document.getElementById("chapter");
const topicSel = document.getElementById("topic");
const levelSel = document.getElementById("level");
const keyOverlay = document.getElementById("keyOverlay");
const keyInput = document.getElementById("keyInput");

let messages = [];
let solved = 0, attempted = 0, problemNumber = 0;
let busy = false;

/* ---- controls setup ---- */
CHAPTERS.forEach((title, i) => {
  const o = document.createElement("option");
  o.value = i + 1;
  o.textContent = "Ch " + (i + 1) + ": " + title;
  chapterSel.appendChild(o);
});
chapterSel.value = "2";

function refreshTopics() {
  topicSel.innerHTML = "";
  const topics = chapterSel.value === "2" ? CH2_TOPICS : ["Any topic from this chapter"];
  topics.forEach(t => {
    const o = document.createElement("option");
    o.textContent = t;
    topicSel.appendChild(o);
  });
}
chapterSel.addEventListener("change", refreshTopics);
refreshTopics();

/* ---- rendering ---- */
function addBubble(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function updateTally() {
  tallyEl.textContent = "solved " + solved + " / attempted " + attempted;
}

/* ---- API key ---- */
function getKey() { return localStorage.getItem("anthropic_key") || ""; }
function showKeyBox() {
  keyInput.value = getKey();
  keyOverlay.classList.remove("hidden");
  keyInput.focus();
}
document.getElementById("keyBtn").addEventListener("click", showKeyBox);
document.getElementById("keySave").addEventListener("click", () => {
  const k = keyInput.value.trim();
  if (!k) return;
  localStorage.setItem("anthropic_key", k);
  keyOverlay.classList.add("hidden");
});

/* ---- Claude call ---- */
async function send(userText, opts) {
  if (busy) return;
  if (!getKey()) { showKeyBox(); return; }
  busy = true;
  setButtons(false);

  addBubble("student", userText);
  messages.push({ role: "user", content: userText });
  const thinking = addBubble("thinking", "thinking…");

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": getKey(),
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });

    const data = await res.json().catch(() => null);
    thinking.remove();

    if (!res.ok) {
      messages.pop(); // keep history consistent with what the tutor saw
      const detail = data && data.error && data.error.message ? data.error.message : ("HTTP " + res.status);
      addBubble("note", "Couldn't reach the tutor: " + detail +
        (res.status === 401 ? "\nCheck your API key (⚙ button)." : "\nTry again."));
      return;
    }

    let text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
    if (text.startsWith("[CORRECT]")) {
      text = text.slice("[CORRECT]".length).trim();
      solved++;
    }
    messages.push({ role: "assistant", content: text });
    if (opts && opts.newProblem) { attempted++; problemNumber++; }
    updateTally();
    addBubble("tutor", text);
  } catch (err) {
    thinking.remove();
    messages.pop();
    addBubble("note", "Network error: " + err.message + "\nCheck your connection and try again.");
  } finally {
    busy = false;
    setButtons(true);
  }
}

function setButtons(enabled) {
  ["newProblem", "primer", "submit", "hint", "solution"].forEach(id => {
    document.getElementById(id).disabled = !enabled;
  });
}

/* ---- buttons ---- */
function selectionText() {
  const ch = chapterSel.value;
  return "Chapter " + ch + " (\"" + CHAPTERS[ch - 1] + "\"), topic: " + topicSel.value +
    ", level: " + levelSel.value;
}

document.getElementById("newProblem").addEventListener("click", () => {
  send("New problem, please. Number it Problem " + (problemNumber + 1) + ". " + selectionText() + ".",
    { newProblem: true });
});

document.getElementById("primer").addEventListener("click", () => {
  send("Primer, please: " + selectionText() + ".");
});

document.getElementById("submit").addEventListener("click", () => {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  send(text);
});

document.getElementById("hint").addEventListener("click", () => {
  send("Hint, please.");
});

document.getElementById("solution").addEventListener("click", () => {
  send("show solution");
});

/* Enter inserts a newline (textarea default) — never sends. Only Submit sends. */

/* ---- first run ---- */
addBubble("tutor",
  "Welcome to the problem session. Pick a chapter, topic, and level above, then tap “New problem” — or “Primer” for a plain-language intro to the topic.");
if (!getKey()) showKeyBox();
</script>
</body>
</html>
